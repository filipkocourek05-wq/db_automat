<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>DB Automat & Excel Porovnávač</title>
<style>
  :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --muted: #94a3b8; --ok: #22c55e; --err: #ef4444; --warn: #f59e0b; --dup: #a855f7; --accent: #38bdf8; }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 420px 1fr; gap: 16px; height: 100vh; overflow: hidden; }
  .card { background: var(--panel); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #334155; overflow: hidden; position: relative; }
  h2, h3 { margin: 0; font-size: 15px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
  .macro-target-box { background: #020617; border: 3px solid var(--accent); border-radius: 8px; padding: 12px; text-align: center; }
  .macro-target-box label { display: block; font-size: 12px; color: var(--accent); margin-bottom: 6px; font-weight: bold; }
  #macroIO { width: 100%; font-size: 20px; font-weight: bold; padding: 12px; text-align: center; background: #0f172a; color: #fff; border: 2px dashed #475569; border-radius: 6px; outline: none; }
  textarea { width: 100%; height: 60px; background: #0f172a; color: var(--text); border: 1px solid #334155; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px; resize: none; }
  button { background: var(--accent); color: #020617; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.15s; font-size: 12px; }
  button:hover { opacity: 0.9; }
  button.secondary { background: #334155; color: var(--text); }
  button.danger { background: var(--err); color: #fff; }
  .commander-panel { background: #020617; border: 1px solid #334155; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
  .stat-item { background: #0f172a; padding: 8px 10px; border-radius: 6px; border-left: 4px solid var(--muted); }
  .stat-item.ok { border-color: var(--ok); } .stat-item.err { border-color: var(--err); } .stat-item.warn { border-color: var(--warn); } .stat-item.dup { border-color: var(--dup); }
  .stat-val { font-size: 18px; font-weight: bold; display: block; }
  .log-container { flex: 1; overflow-y: auto; border: 1px solid #334155; border-radius: 6px; background: #020617; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th { position: sticky; top: 0; background: #1e293b; color: var(--muted); text-align: left; padding: 10px; border-bottom: 1px solid #334155; z-index: 10; }
  td { padding: 8px 10px; border-bottom: 1px solid #1e293b; font-family: Consolas, monospace; vertical-align: middle; word-wrap: break-word; }
  tr.row-OK { background: rgba(34, 197, 94, 0.08); } tr.row-MISSING { background: rgba(239, 68, 68, 0.28); color: #fca5a5; font-weight: bold; } tr.row-MULTI { background: rgba(245, 158, 11, 0.25); color: #fde68a; font-weight: bold; } tr.row-DUP { background: rgba(168, 85, 247, 0.22); color: #e9d5ff; } tr.row-DENIED { background: rgba(245, 158, 11, 0.4); color: #fff; font-weight: bold; }
  .pill { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
  .pill-OK { background: var(--ok); color: #000; } .pill-MISSING { background: var(--err); color: #fff; } .pill-MULTI, .pill-DENIED { background: var(--warn); color: #000; } .pill-DUP { background: var(--dup); color: #fff; }
  .row-flex { display: flex; gap: 8px; align-items: center; }
  input[type="text"], input[type="number"], select { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 6px 8px; border-radius: 4px; width: 100%; font-size: 12px;}
  .del-btn { cursor: pointer; color: var(--err); font-weight: bold; font-size: 14px; background: none; border: none; padding: 0; }
  .del-btn:hover { color: #fca5a5; }
  .export-panel { background: #020617; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; font-size: 12px; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
  .modal-box { background: var(--panel); border: 1px solid #334155; border-radius: 8px; padding: 20px; width: 400px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
</style>
</head>
<body>
  <div class="card" style="overflow-y: auto;">
    <div class="row-flex" style="justify-content:space-between;">
      <h2>1. USB Makropad</h2>
      <button id="btnConnect" onclick="connectSerial()" style="background:var(--err); color:#fff;">Nepřipojeno (Klikni)</button>
    </div>
    <div class="macro-target-box">
      <label id="stepLabel">PŘIPRAVENO (Přijímám data od makropadu)</label>
      <input type="text" id="macroIO" placeholder="SEM NAKALIBRUJ BOD 10" autocomplete="off">
    </div>

    <hr style="border-color:#334155; width:100%; margin:2px 0;">
    <h2>2. Velení Makropadu (Commander)</h2>
    <div class="commander-panel">
      <div class="row-flex">
        <label style="font-size:12px; white-space:nowrap;">Počet položek v DB:</label>
        <input type="number" id="dbTotalItems" value="50" min="1" style="width: 70px;">
        <button onclick="startReadingCycle()" style="flex:1; background:var(--ok);">🔍 Extrakt Dat</button>
      </div>
      <div class="row-flex" style="margin-top: 4px;">
        <label style="font-size:12px; white-space:nowrap; color:var(--muted);">Skok na pol.:</label>
        <input type="number" id="testTargetItem" value="43" min="1" style="width: 70px;">
        <button class="secondary" onclick="testGoToItem()" style="flex:1;">Provést Scroll Test</button>
      </div>
      <div class="row-flex" style="margin-top: 4px;">
        <button class="secondary" disabled style="flex:1; opacity:0.5;" title="Work in progress">🗑 Vymazat chybějící (WIP)</button>
        <button class="secondary" disabled style="flex:1; opacity:0.5;" title="Work in progress">✍️ Zapsat do DB (WIP)</button>
      </div>
    </div>

    <hr style="border-color:#334155; width:100%; margin:2px 0;">
    <h2>3. Import a Nastavení</h2>
    <textarea id="excelInput" placeholder="V Excelu dej Ctrl+A, Ctrl+C, vlož sem (Ctrl+V) a klikni na Načíst..."></textarea>
    <div class="row-flex">
      <button onclick="parseExcel()" style="flex:1;">Načíst Excel (filtr L = Aktuell)</button>
      <input type="text" id="fallbackVal" placeholder="Výchozí C (Když chybí 1. pol.)" style="width:160px;">
    </div>
    <div id="excelStatus" style="font-size: 12px; color: var(--muted);">Zatím nenačtena data.</div>
    
    <div class="stats-grid" style="margin-top:8px;">
      <div class="stat-item ok"><span class="stat-val" id="stOk">0</span>Nalezeno (OK)</div>
      <div class="stat-item err"><span class="stat-val" id="stErr">0</span>Chybí (Smazat)</div>
      <div class="stat-item warn"><span class="stat-val" id="stMulti">0</span>Více výsl. / Deny</div>
      <div class="stat-item dup"><span class="stat-val" id="stDup">0</span>Duplicity</div>
    </div>
  </div>

  <div class="card">
    <div class="row-flex" style="justify-content: space-between; flex-wrap: wrap; margin-bottom: 4px;">
      <div class="row-flex">
        <select id="folderSelect" onchange="changeFolder()" style="width: 150px;"></select>
        <button onclick="addFolder()">+ Složka</button>
        <button class="danger" onclick="deleteFolder()">Smazat Složku</button>
      </div>
      <label style="font-size:12px; cursor:pointer;"><input type="checkbox" id="onlyErrors" onchange="renderLog()"> Jen problémové zobrazení</label>
    </div>
    
    <div class="row-flex export-panel" style="justify-content: space-between;">
      <div class="row-flex" style="gap: 12px;">
        <span style="color: var(--muted); font-weight: bold;">Stáhnout jako CSV:</span>
        <label style="cursor:pointer; color:var(--err);"><input type="checkbox" id="expMissing" checked> Chybí v Excelu</label>
        <label style="cursor:pointer; color:var(--warn);"><input type="checkbox" id="expDenied" checked> Zamítnuto/Multi</label>
        <label style="cursor:pointer; color:var(--dup);"><input type="checkbox" id="expDup"> Duplicity</label>
        <label style="cursor:pointer; color:var(--ok);"><input type="checkbox" id="expOk"> V pořádku (OK)</label>
      </div>
      <button class="secondary" onclick="exportCSVFile()" style="padding: 4px 12px; font-size: 13px;">Stáhnout</button>
    </div>

    <div class="log-container">
      <table>
        <thead>
          <tr>
            <th style="width: 110px;">Pozice DB</th>
            <th style="width: 20%;">Data A</th>
            <th style="width: 15%;">Data B</th>
            <th style="width: 15%;">Data C</th>
            <th style="width: 130px;">Stav</th>
            <th>Poznámka</th>
            <th style="width: 30px;"></th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modalní okno pro poznámku -->
  <div id="noteModal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-bottom: 15px;">Přidat / Upravit poznámku</h3>
      <div id="denyOptionsGroup" style="margin-bottom: 10px; display: none;">
        <label style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px;">Důvod zamítnutí:</label>
        <select id="denyPresetSelect" onchange="handlePresetChange()">
          <option value="Chybí odpovídající testing characteristics">Chybí odpovídající testing characteristics</option>
          <option value="Vícero testing characteristics na výběr se stejným názvem">Vícero testing characteristics na výběr se stejným názvem</option>
          <option value="custom">Vlastní poznámka...</option>
        </select>
      </div>
      <input type="text" id="noteTextInput" placeholder="Zadej text poznámky..." autocomplete="off">
      <div class="row-flex" style="margin-top: 15px; justify-content: flex-end;">
        <button class="secondary" onclick="closeNoteModal()">Zrušit</button>
        <button onclick="saveNote()">Uložit poznámku</button>
      </div>
    </div>
  </div>

<script>
  let dbData = [];
  let currentEditingLogId = null;

  // Stav cyklu čtení
  let readingActive = false;
  let currentTargetItem = 1;
  let totalTargetItems = 1;
  let tempA = "";
  let tempB = "";
  let lastValidC = ""; 

  let appState = {
    folders: ["Výchozí složka"],
    activeFolder: "Výchozí složka",
    logs: [],
    globalSeq: 1
  };

  function saveState() { localStorage.setItem('dbAutomatState', JSON.stringify(appState)); }
  function loadState() {
    const saved = localStorage.getItem('dbAutomatState');
    if (saved) { appState = JSON.parse(saved); }
    if (!appState.folders || appState.folders.length === 0) appState.folders = ["Výchozí složka"];
    if (!appState.activeFolder) appState.activeFolder = appState.folders[0];
    if (!appState.globalSeq) appState.globalSeq = 1;
    renderFolders(); updateStats(); renderLog();
  }

  function renderFolders() {
    const sel = document.getElementById('folderSelect'); sel.innerHTML = "";
    appState.folders.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f; opt.textContent = f;
      if (f === appState.activeFolder) opt.selected = true;
      sel.appendChild(opt);
    });
  }
  function changeFolder() { appState.activeFolder = document.getElementById('folderSelect').value; saveState(); renderLog(); updateStats(); }
  function addFolder() {
    const name = prompt("Název nové složky pro logy:");
    if (name && name.trim() !== "" && !appState.folders.includes(name)) {
      appState.folders.push(name.trim()); appState.activeFolder = name.trim();
      saveState(); renderFolders(); renderLog(); updateStats();
    }
  }
  function deleteFolder() {
    if (appState.folders.length <= 1) return alert("Poslední složku nelze smazat.");
    if (confirm(`Opravdu smazat složku "${appState.activeFolder}" a všechny její logy?`)) {
      appState.logs = appState.logs.filter(l => l.folder !== appState.activeFolder);
      appState.folders = appState.folders.filter(f => f !== appState.activeFolder);
      appState.activeFolder = appState.folders[0];
      saveState(); renderFolders(); renderLog(); updateStats();
    }
  }

  let serialPort; let serialWriter;
  async function connectSerial() {
    try {
      serialPort = await navigator.serial.requestPort();
      await serialPort.open({ baudRate: 9600 });
      const textEncoder = new TextEncoderStream(); textEncoder.readable.pipeTo(serialPort.writable);
      serialWriter = textEncoder.writable.getWriter();
      updateMacropadState();
    } catch (e) { alert("Nepodařilo se připojit: " + e); }
  }
  async function updateMacropadState() {
    const btn = document.getElementById('btnConnect');
    if (serialWriter) {
      await sendToMacro("READY"); 
      btn.textContent = "ZAPOJENO"; btn.style.background = "var(--ok)"; btn.style.color = "#000";
    }
  }
  async function sendToMacro(cmd) { if (serialWriter) await serialWriter.write(cmd + "\n"); }

  // --- COMMANDER FUNKCE ---
  function testGoToItem() {
    const N = parseInt(document.getElementById('dbTotalItems').value, 10);
    const X = parseInt(document.getElementById('testTargetItem').value, 10);
    if (!serialWriter) return alert("Nejprve připoj makropad!");
    document.getElementById('stepLabel').textContent = `SCROLL TEST: Hledám položku ${X}/${N}...`;
    sendToMacro(`GOTO:${X}:${N}`);
  }

  function startReadingCycle() {
    if (!serialWriter) return alert("Nejprve připoj makropad!");
    if (dbData.length === 0) return alert("Nejprve načti Excel!");
    
    totalTargetItems = parseInt(document.getElementById('dbTotalItems').value, 10);
    currentTargetItem = 1;
    readingActive = true;
    tempA = ""; tempB = "";
    
    document.getElementById('stepLabel').textContent = `ČTU POLOŽKU ${currentTargetItem} z ${totalTargetItems}...`;
    document.getElementById('stepLabel').style.color = "var(--accent)";
    sendToMacro(`READ_ITEM:${currentTargetItem}:${totalTargetItems}`);
  }

  // --- ZPRACOVÁNÍ DAT OD MAKROPADU ---
  const ioInput = document.getElementById('macroIO');
  ioInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = ioInput.value.trim();
      ioInput.value = "";

      // Stará ruční DNY/ERR logika pro jistotu ponechána
      if (val.startsWith("ERR") || val.startsWith("DNY")) {
        const isDeny = val.startsWith("DNY");
        const posNum = val.replace("ERR", "").replace("DNY", "");
        let currentFolderLogs = appState.logs.filter(l => l.folder === appState.activeFolder);
        if (currentFolderLogs.length > 0) {
          let lastLog = currentFolderLogs[0];
          lastLog.dbPosText = "Pozice: " + posNum;
          if (isDeny) { lastLog.status = "DENIED"; lastLog.statusText = "ZAMÍTNUTO (Ruční Deny)"; }
          saveState(); renderLog(); updateStats();
        }
        return;
      }

      // Nová Commander logika s jasnými prefixy
      if (val.startsWith("D_A:")) {
        tempA = val.replace("D_A:", "").trim();
      } 
      else if (val.startsWith("D_B:")) {
        tempB = val.replace("D_B:", "").trim();
      } 
      else if (val.startsWith("D_POS:")) {
        const posStr = val.replace("D_POS:", "").trim();
        evaluateLookupAndLog(tempA, tempB, posStr);
        
        // Zacyklení
        if (readingActive) {
          currentTargetItem++;
          if (currentTargetItem <= totalTargetItems) {
            document.getElementById('stepLabel').textContent = `ČTU POLOŽKU ${currentTargetItem} z ${totalTargetItems}...`;
            sendToMacro(`READ_ITEM:${currentTargetItem}:${totalTargetItems}`);
          } else {
            readingActive = false;
            document.getElementById('stepLabel').textContent = "HOTOVO: Čtení dokončeno.";
            document.getElementById('stepLabel').style.color = "var(--ok)";
            alert("Čtení všech položek bylo dokončeno!");
          }
        }
      }
    }
  });

  function parseExcel() {
    const raw = document.getElementById('excelInput').value;
    if (!raw.trim()) return alert("Vlož data z Excelu!");
    const lines = raw.split(/\r?\n/); dbData = []; let totalRows = 0;
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      totalRows++; const cols = lines[i].split('\t');
      if ((cols[11] || "").trim().toLowerCase() === "aktuell") dbData.push({ a: (cols[0] || "").trim(), b: (cols[1] || "").trim(), f: (cols[5] || "").trim() });
    }
    const fbInput = document.getElementById('fallbackVal');
    if (!fbInput.value && dbData.length > 0) fbInput.value = dbData[0].f;
    document.getElementById('excelStatus').innerHTML = `Načteno <b>${totalRows}</b> řádků. Aktivních: <b style="color:var(--ok)">${dbData.length}</b>.`;
  }

  function evaluateLookupAndLog(valA, valB, posVal) {
    const normA = valA.toLowerCase(); const normB = valB.toLowerCase();
    const existingLogs = appState.logs.filter(l => l.folder === appState.activeFolder && l.a.toLowerCase() === normA && l.b.toLowerCase() === normB);
    const count = existingLogs.length + 1;
    const matches = dbData.filter(item => item.a.toLowerCase() === normA && item.b.toLowerCase() === normB);

    let status = "OK"; let statusText = "OK"; let outputC = "";
    const fallback = document.getElementById('fallbackVal').value;

    if (matches.length === 0) {
      status = "MISSING"; outputC = lastValidC !== "" ? lastValidC : fallback; statusText = "CHYBÍ V EXCELU";
    } else if (matches.length > 1) {
      status = "MULTI"; outputC = matches[0].f; lastValidC = outputC; statusText = `VÍCE SHOD (${matches.length}x)`;
    } else {
      outputC = matches[0].f; lastValidC = outputC;
      if (count > 1) { status = "DUP"; statusText = `DUPLICITA (${count}x)`; }
    }
    if (status !== "DUP" && count > 1) statusText += ` [Opak. ${count}x]`;

    const newLog = {
      id: Date.now(), folder: appState.activeFolder, seq: appState.globalSeq++,
      dbPosText: "Pozice: " + posVal, a: valA, b: valB, c: outputC, status: status, statusText: statusText, note: ""
    };
    appState.logs.unshift(newLog); 
    saveState(); updateStats(); renderLog();
  }

  // --- LOGOVÁNÍ A UI ---
  function updateStats() {
    const curLogs = appState.logs.filter(l => l.folder === appState.activeFolder);
    document.getElementById('stOk').textContent = curLogs.filter(l => l.status === 'OK').length;
    document.getElementById('stErr').textContent = curLogs.filter(l => l.status === 'MISSING').length;
    document.getElementById('stMulti').textContent = curLogs.filter(l => l.status === 'MULTI' || l.status === 'DENIED').length;
    document.getElementById('stDup').textContent = curLogs.filter(l => l.status === 'DUP').length;
  }

  function renderLog() {
    const onlyErr = document.getElementById('onlyErrors').checked;
    const tbody = document.getElementById('logBody'); tbody.innerHTML = "";
    let curLogs = appState.logs.filter(l => l.folder === appState.activeFolder);
    if (onlyErr) curLogs = curLogs.filter(l => l.status !== 'OK' && l.status !== 'DUP');

    for (const item of curLogs) {
      const tr = document.createElement('tr'); tr.className = `row-${item.status}`;
      const safeNote = item.note || "";
      tr.innerHTML = `
        <td>${escapeHtml(item.dbPosText)}</td>
        <td>${escapeHtml(item.a)}</td>
        <td>${escapeHtml(item.b)}</td>
        <td>${escapeHtml(item.c)}</td>
        <td><span class="pill pill-${item.status}">${item.statusText}</span></td>
        <td>
          <div class="row-flex" style="justify-content:space-between; width:100%;">
            <span style="font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:inline-block; max-width: 140px;" title="${escapeHtml(safeNote)}">${escapeHtml(safeNote)}</span>
            <button class="secondary" style="padding: 2px 6px; font-size: 10px;" onclick="openNoteModal(${item.id})">📝</button>
          </div>
        </td>
        <td><button class="del-btn" onclick="deleteLog(${item.id})" title="Smazat">🗑</button></td>
      `;
      tbody.appendChild(tr);
    }
  }

  function deleteLog(id) { appState.logs = appState.logs.filter(l => l.id !== id); saveState(); updateStats(); renderLog(); }
  
  // --- POZNÁMKY (MODAL) ---
  function openNoteModal(id) {
    const log = appState.logs.find(l => l.id === id);
    if (!log) return;
    currentEditingLogId = id;
    const modal = document.getElementById('noteModal');
    const denyGroup = document.getElementById('denyOptionsGroup');
    const presetSelect = document.getElementById('denyPresetSelect');
    const txtInput = document.getElementById('noteTextInput');
    const existingNote = log.note || "";
    
    if (log.status === 'DENIED') {
      denyGroup.style.display = 'block';
      if (existingNote === "Chybí odpovídající testing characteristics" || existingNote === "Vícero testing characteristics na výběr se stejným názvem") {
        presetSelect.value = existingNote; txtInput.style.display = 'none';
      } else if (existingNote === "") {
        presetSelect.value = "Chybí odpovídající testing characteristics"; txtInput.style.display = 'none';
      } else {
        presetSelect.value = "custom"; txtInput.style.display = 'block'; txtInput.value = existingNote;
      }
    } else {
      denyGroup.style.display = 'none'; txtInput.style.display = 'block'; txtInput.value = existingNote;
    }
    modal.style.display = 'flex'; if (txtInput.style.display === 'block') txtInput.focus();
  }

  function handlePresetChange() {
    const presetSelect = document.getElementById('denyPresetSelect'); const txtInput = document.getElementById('noteTextInput');
    if (presetSelect.value === 'custom') { txtInput.style.display = 'block'; txtInput.focus(); txtInput.value = ""; } 
    else { txtInput.style.display = 'none'; }
  }

  function closeNoteModal() { document.getElementById('noteModal').style.display = 'none'; currentEditingLogId = null; }
  function saveNote() {
    if (!currentEditingLogId) return;
    const log = appState.logs.find(l => l.id === currentEditingLogId);
    if (!log) return;
    const presetSelect = document.getElementById('denyPresetSelect'); const txtInput = document.getElementById('noteTextInput');
    log.note = (log.status === 'DENIED' && presetSelect.value !== 'custom') ? presetSelect.value : txtInput.value.trim();
    saveState(); renderLog(); closeNoteModal();
  }

  // --- CSV EXPORT ---
  function exportCSVFile() {
    const expMissing = document.getElementById('expMissing').checked;
    const expDenied = document.getElementById('expDenied').checked;
    const expDup = document.getElementById('expDup').checked;
    const expOk = document.getElementById('expOk').checked;

    let toExport = appState.logs.filter(l => l.folder === appState.activeFolder).filter(l => {
      if (l.status === 'MISSING') return expMissing;
      if (l.status === 'MULTI' || l.status === 'DENIED') return expDenied;
      if (l.status === 'DUP') return expDup;
      if (l.status === 'OK') return expOk;
      return false;
    });

    if (toExport.length === 0) return alert("S tímto filtrem nebyly nalezeny žádné záznamy k exportu.");
    let csvContent = "\uFEFFPozice_v_DB;Data_A;Data_B;Data_C;Stav_Chyby;Poznamka\n";
    toExport.forEach(p => {
       let safePos = String(p.dbPosText).replace(/;/g, ","); let safeA = String(p.a).replace(/;/g, ",");
       let safeB = String(p.b).replace(/;/g, ","); let safeC = String(p.c).replace(/;/g, ",");
       let safeStatus = String(p.statusText).replace(/;/g, ","); let safeNote = String(p.note || "").replace(/;/g, ",");
       csvContent += `${safePos};${safeA};${safeB};${safeC};${safeStatus};${safeNote}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Export_${appState.activeFolder.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
  }
  
  function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
  loadState();
</script>
</body>
</html>
